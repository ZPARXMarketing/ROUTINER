<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Claude Routine Planner — ZPARX</title>
  <meta name="description" content="Plan, schedule, and fire Claude prompts on a routine. A Notion-to-Claude style command center by ZPARX." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Apple Touch Icons for iOS / iPadOS home screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="assets/apple-touch-icon-167x167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-touch-icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-touch-icon-120x120.png" />

  <!-- ZPARX brand fonts (Google Fonts CDN) — loaded NON-blocking.
       A plain <link rel="stylesheet"> to a third-party host blocks first paint,
       so whenever fonts.googleapis.com was slow or unreachable the page was
       white — not "unstyled", *empty* — with no way to tell a slow load from a
       broken one. `media="print"` makes the fetch non-render-blocking; the
       onload flips it back to `all` once it lands. Type renders immediately in
       the fallback and swaps when the webfont arrives (the URL already carries
       display=swap), and if Google never answers the app still works. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen:wght@400;700&display=swap" /></noscript>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <!-- ── Top bar: brand + navigation + actions (one rail, Claude-Code style) ── -->
    <header class="topbar" id="topbar" style="display:none">
      <div class="brand brand--bar">
        <img class="brand__logo" src="assets/zparx-lockup.svg" alt="ZPARX" />
        <span class="brand__wordmark">Routiner</span>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-view="history">Chat</button>
        <button class="tab" data-view="calendar">Calendar</button>
        <button class="tab" data-view="board">Board <span class="tab__count" data-count="board">0</span></button>
        <button class="tab" data-view="scheduled">Scheduled <span class="tab__count" data-count="scheduled">0</span></button>
        <button class="tab" data-view="library">Library <span class="tab__count" data-count="library">0</span></button>
        <button class="tab" data-view="archived">Archived <span class="tab__count" data-count="archived">0</span></button>
      </nav>

      <div class="topbar__actions">
        <span class="clock clock--time" id="clock">—</span>
        <button class="clock budget-chip" id="budgetChip" title="Projected spend from everything scheduled — click for the breakdown" style="display:none">—</button>
        <button class="btn btn--primary btn--icon" id="newBtn" title="New routine" aria-label="New routine">+</button>
        <div class="acctmenu" id="acctMenu">
          <button class="acctmenu__btn" id="userChip" title="Account" aria-haspopup="true" aria-expanded="false"></button>
          <div class="acctmenu__pop" id="acctPop" role="menu">
            <span class="acctmenu__who" id="acctWho"></span>
            <button class="acctmenu__item" id="settingsBtn" role="menuitem">Settings</button>
            <a class="acctmenu__item" href="usage.html" role="menuitem" title="OpenRouter credit &amp; spend meter">Usage</a>
            <button class="acctmenu__item acctmenu__item--danger" id="signOutBtn" role="menuitem">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <main id="view">
        <!-- Boot placeholder. The app replaces this the moment it has decided
             whether to show the sign-in card or the workspace; the watchdog at
             the bottom of this file turns it into an actionable error if that
             never happens. Before it existed, any failure to boot left this
             element empty and the topbar hidden — a blank white page whose only
             affordance was a refresh. -->
        <div class="loadstate" id="boot">
          <span class="loadstate__spin" id="bootSpin" aria-hidden="true"></span>
          <p id="bootMsg" role="status">Loading Routiner…</p>
          <p class="loadstate__hint" id="bootHint" hidden></p>
          <button class="btn btn--primary" id="bootRetry" hidden>Reload</button>
        </div>
      </main>
    </div>
  </div>

  <!-- ── Drawer (new / edit routine) ── -->
  <div class="overlay" id="overlay">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer__head">
        <h2 id="drawerTitle">New routine</h2>
        <button class="drawer__close" id="drawerClose" aria-label="Close">×</button>
      </div>
      <div class="drawer__body" id="drawerBody"><!-- injected --></div>
      <div class="drawer__foot" id="drawerFoot"><!-- injected --></div>
    </aside>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- ── Boot watchdog ──
       A classic (non-module) script so it runs even if the module graph below
       is what's broken. Its whole job is to make sure a failed or slow boot
       says something instead of showing an empty page: a stuck load is
       indistinguishable from a broken one, and the only move a blank page
       leaves you is refreshing until it happens to work. -->
  <script>
    (function () {
      var el = function (id) { return document.getElementById(id); };
      var settled = false;
      /* Long enough that a slow-but-working connection is never accused of
         failing; short enough that nobody sits on a dead page. */
      var timer = setTimeout(function () {
        stall('Still loading…', 'Routiner is taking longer than usual to reach Supabase. Check your connection, then reload.');
      }, 12000);

      function stall(msg, hint) {
        if (settled) return;
        var m = el('bootMsg'), h = el('bootHint'), r = el('bootRetry'), s = el('bootSpin');
        if (!m) return;
        m.textContent = msg;
        if (h) { h.textContent = hint; h.hidden = false; }
        if (r) { r.hidden = false; r.onclick = function () { location.reload(); }; }
        if (s) s.hidden = true;
      }

      /* Called by js/app.js once init() has resolved and painted something. */
      window.__routinerBooted = function () { settled = true; clearTimeout(timer); };
      window.__routinerBootFailed = function (why) {
        clearTimeout(timer);
        stall('Routiner didn’t start', why || 'Something went wrong while starting up. Reload to try again.');
        settled = true;
      };

      /* The module itself failed to download or parse — the case that used to
         produce a permanently blank page. Report it immediately rather than
         waiting out the watchdog. */
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT' && !settled) {
          clearTimeout(timer);
          stall('Routiner didn’t start', 'A required script failed to load. Reload to try again.');
        }
      }, true);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
